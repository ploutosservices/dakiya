<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t">
  <title id="t">Dakiya — an Indian postman in his peaked cap, a letter held up, his mail bag at his side (dark, for a light ground)</title>
  <g fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- the peaked cap: its flat crown, the badge and the visor -->
    <path d="M40 24 H84 L80 38 H44 Z"/>
    <path d="M62 31 H62.5"/>
    <path d="M44 38 C50 45 74 45 80 38"/>
    <!-- the face, ears, eyes and the moustache -->
    <path d="M46 44 C45 62 53 70 62 70 C71 70 79 62 78 44"/>
    <path d="M46 50 C42 50 42 57 46.5 58 M78 50 C82 50 82 57 77.5 58"/>
    <path d="M56 52 V53 M68 52 V53"/>
    <path d="M51 61 C55 57 59 58 62 60 C65 58 69 57 73 61"/>
    <!-- the shoulders and the collar -->
    <path d="M26 122 C26 94 38 80 54 76 M96 108 C94 90 86 80 70 76"/>
    <path d="M54 76 L62 86 L70 76"/>
    <!-- the bag's strap across the chest, and the bag at his left hip -->
    <path d="M78 80 L42 108"/>
    <path d="M16 104 H46 V122 H16 Z M16 110 H46"/>
    <!-- his right arm raised, the letter in his hand -->
    <path d="M90 86 C96 84 100 80 103 76"/>
    <path d="M94 56 H120 V76 H94 Z M94 56 L107 67 L120 56"/>
  </g>
</svg>
