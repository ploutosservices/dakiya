# A complete, throwaway deployment: PostgreSQL, the service, nginx as the mTLS proxy with its own CA,
# and an SMTP catcher standing in for the outside world. Nothing here is a production setting.
#
#   docker compose run --build --rm tests     then   docker compose down -v
#
# starts everything the tests depend on, runs the rule tests, the SMTP hand-over test and the
# end-to-end test (tests/e2e.py) against it, and exits with their result. Every mail the demo sends
# is caught, never delivered: http://127.0.0.1:8025 shows them.
name: dakiya-demo

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: mailsend
      POSTGRES_USER: mailsend
      POSTGRES_HOST_AUTH_METHOD: trust     # demo only: no password on a throwaway network
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "mailsend", "-d", "mailsend"]
      interval: 2s
      retries: 30

  certs:
    build: .
    entrypoint: ["venv/bin/python", "demo/make-certs.py", "/certs"]
    volumes:
      - certs:/certs

  # The schema, then the demo's tenant, inbox and grant. Run once, before the service starts.
  migrate:
    build: .
    entrypoint: ["sh", "-c", "venv/bin/python -m mailsend.schema_migrate --apply && venv/bin/python demo/seed.py"]
    env_file: .env.example
    depends_on:
      postgres: { condition: service_healthy }

  # Catches every mail and delivers none. STARTTLS with the demo CA's certificate, as the service
  # requires of an SMTP door.
  smtp:
    image: axllent/mailpit:v1.20.4
    environment:
      MP_SMTP_TLS_CERT: /certs/smtp.pem
      MP_SMTP_TLS_KEY: /certs/smtp.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
    volumes:
      - certs:/certs:ro
    ports:
      - "127.0.0.1:8025:8025"     # the caught mail, in a browser
    depends_on:
      certs: { condition: service_completed_successfully }

  # The socket is made world-writable (umask 000) because only nginx shares its volume.
  mail-send:
    build: .
    entrypoint: ["sh", "-c", "umask 000 && exec ./run.sh"]
    env_file: .env.example
    volumes:
      - sock:/sock
      - certs:/certs:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      smtp: { condition: service_started }

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/certs:ro
      - sock:/sock
    ports:
      - "127.0.0.1:8443:8443"     # to try it with curl and a demo certificate
    depends_on:
      certs: { condition: service_completed_successfully }
      mail-send: { condition: service_started }

  tests:
    build: .
    entrypoint: ["sh", "-c", "venv/bin/python tests/conformance.py && venv/bin/python tests/smtp-drill.py && venv/bin/python tests/e2e.py"]
    environment:
      E2E_URL: https://nginx:8443
      E2E_CERTS: /certs
      E2E_CAUGHT: http://smtp:8025
    volumes:
      - certs:/certs:ro
    depends_on:
      nginx: { condition: service_started }

volumes:
  certs:
  sock:
