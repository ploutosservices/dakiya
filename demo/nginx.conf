# The mTLS proxy of the demo. The one rule that makes the identity header trustworthy: it is SET
# from a verified certificate and CLEARED on every request without one, so a caller cannot type it.
map $ssl_client_verify $client_identity {
    SUCCESS  $ssl_client_s_dn;
    default  "";
}

server {
    listen 8443 ssl;
    server_name nginx;

    ssl_certificate         /certs/nginx.pem;
    ssl_certificate_key     /certs/nginx.key;
    ssl_client_certificate  /certs/ca.pem;
    ssl_verify_client       optional;

    client_max_body_size 30m;

    # The service listens on a unix socket in a volume only this proxy shares, so the proxy is the
    # only way in.
    location / {
        proxy_set_header X-Client-Identity $client_identity;
        proxy_set_header Host $host;
        proxy_pass http://unix:/sock/mail-send.sock;
    }
}
